<html>
	<head>
		<title>HTML Formatting Tags</title>
	</head>
	<body>
		<p>
			Hello, I am <mark><b>Jaya Prakash</b></mark> , use "b" and "mark" for bold and highliting
		</p>
		<p>
			<i>This is italic</i>
			<br> 
			<u> This is Underline</u>
			<br> 
			<strong> This is Strong</strong>
			<br>
			<small>This is Small</small>
			<br>
			H<sub>2</sub>O
			<br>
			X<sup>2</sup>
		</p>
	</body>
</html>
