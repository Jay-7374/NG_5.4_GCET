<html>
	<head>
		<title> Forms </title>
	</head>
	<body>
		<h1> Registration Form </h1>
		<form>
			<label> Enter your First Name : </label>
			<input type = "text" placeholder = "Enter your First name" required/>
			<br> <br>
			<label> Enter your Last Name : </label>
			<input type = "text" placeholder = "Enter your Last name" />
			<br><br>
			<label> Enter your Mail : </label>
			<input type = "mail" placeholder = "Enter your Mail" />
			<br><br>
			<label> Enter your Number : </label>
			<input type = "number" placeholder = "Enter your number" />
			<br><br>
			<label> Enter your Password : </label>
			<input type = "password" placeholder = "Enter your password" />
			<br></br>
			<label> Enter your D.O.B : </label>
			<input type = "date"/>
			<br><br>
			<label> Skills : </label>
			<input type = "checkbox" />
			<label> C Language</label>
			<input type = "checkbox" />
			<label> Python</label>
			<input type = "checkbox" />
			<label> Java</label>
			<br><br>
			<label> Gender : </label>
			<input type = "radio" name="gender"/>
			<label> Male</label>
			<input type = "radio" name="gender" />
			<label> Female</label>
			<input type = "radio" name="gender"/>
			<label> Others</label>
			<br><br>
			<select>
				<option> CSE </option>
				<option> CS </option>
				<option> DS </option>
				<option> AI & ML </option>
				<option> EEE </option>
				<option selected> MECH </option>
			</select>
			<br><br>
			<label> Address : </label>
			<textarea rows = 12 cols = 50></textarea>
			<br><br>
			<input type = "submit">
			<br><br>
			<label> Already have an account? <a href="Login.html" target="_blank">Login</a></label>
		</form>
	</body>
</html>
