<html>
	<head>
		<title> Forms </title>
	</head>
	<body>
		<center><h1> Student Registration Form </h1>
			<h3> Fill in your Details to Register <h3></center>
		<form align = "center">
			<label><b>Full Name *</b> : </label>
			<input type = "text" placeholder = "Enter your Full name" required/>
			<br> <br>
			<label> <b>Mail *</b> : </label>
			<input type = "mail" placeholder = "Enter your email" />
			<br><br>
			<label> <b>Password * </b> : </label>
			<input type = "password" placeholder = "Enter your password" />
			<br></br>
			<label> <b>Mobile Number *</b> : </label>
			<input type = "number" placeholder = "Enter your mobile number" />
			<br><br>
			<label> <b>Gender * </b>: </label>
			<input type = "radio" name="gender"/>
			<label> Male</label>
			<input type = "radio" name="gender" />
			<label> Female</label>
			<input type = "radio" name="gender"/>
			<label> Others</label>
			<br><br>
			<label> <b>Skills * </b>: </label>
			<input type = "checkbox" />
			<label> HTML</label>
			<input type = "checkbox" />
			<label> CSS</label>
			<input type = "checkbox" />
			<label>Javascript</label>
			<input type = "checkbox" />
			<label> Java</label>
			<br><br>
			<label><b> Course *</b> :</label>
			<select>
				<option> -- Select Course--</option>
				<option> CSE </option>
				<option> CS </option>
				<option> DS </option>
				<option> AI & ML </option>
				<option> EEE </option>
				<option> MECH </option>
			</select>
			<br><br>
			<label><b> Programming Languages</b> :</label>
			<select >
			<table>
				<option> Python </option>
				<option> Java </option>
				<option> JavaSript </option>
				<option> C </option>
				<option> C++ </option>
				<option> PHP </option>
			</table>
			</select>
			<br><br>
			<label> <b>Age *</b> : </label>
			<input type = "number" placeholder = "15 - 60" />
			<br><br>
			<label> <b>Linkedin Profile </b> : </label>
			<input type = "text" placeholder = "https://www.linkedin.com/in/username" />
			<br><br>
			<label> <b>Prefered Training Time  </b>: </label>
			<input type = "time"/>
			<br><br>
			<label> <b>Joining Month  </b>: </label>
			<input type = "month"/>
			<br><br>
			<label> <b>Interview Date & Time  </b>: </label>
			<input type = "date"/>
			<br><br>
			<label><b> Address </b>: </label>
			<textarea rows = 6 cols = 50></textarea>
			<br><br>
			<label><b> City </b>: </label>
			<select>
				<option> -- Select City--</option>
				<option> Hyderabad </option>
				<option> Warangal </option>
				<option> Bangalore </option>
				<option> Chennai </option>
				<option> Mumbai </option>
				<option> Delhi </option>
			</select>
			<br><br>
			<label><b> Search Course </b>: </label>
			<input type = "text" placeholder = "Search Course"/>
			<br><br>
			<input type = "checkbox" />
			<label> I agree to the <a href="">Terms and Conditions</a></label>
			<br><br>
			<input type = "submit">
			<br><br>
			<label> Already have an account? <a href="Login_2.html" target="_blank">Login</a></label>
		</form>
	</body>
</html>
