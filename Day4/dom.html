<!DOCTYPE html>
<html lang="en">    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DOM</title>
    </head>
    <style>
        .main-heading-style{
            color: red;
            border: 1px solid red;
        }
        .buttonstyle{
            background-color: green;
            padding: 150px;
            color: white;
            border: none;
            font-weight: bold;
            margin-left: 200px;
            border-top-left-radius: 500px;
            border-bottom-right-radius: 500px;
            border: 5px dashed orange;
            cursor: pointer;
            transition: transform 0.5s ease-in-out;
            transform: scale(1.1);

        }
        .buttonstyle:hover{
            background-color: orange;
        }
    </style>
    <body>
        <h1 id="mainheading">Dom operations</h1>

        <h1 id="hello">Hello World</h1>
        <button id="submitbtn">submit</button>
    </body>

    <script>
let mainh1tag = document.getElementById("mainheading");
mainh1tag.classList.add("main-heading-style");
let hellotag = document.getElementById("hello");
let submitbtn = document.getElementById("submitbtn");
submitbtn.classList.add("buttonstyle");
    </script>
</html>
