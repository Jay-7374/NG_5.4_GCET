<!DOCTYPE html>
<html lang="en">    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DOM</title>
    </head>
    <style>
        .buttonstyle{
            background-color: green;
            padding: 20px 40px;
            color: white;
            border: none;
            font-weight: bold;
            margin-left: 50px;
            border-top-left-radius: 40px;
            border-bottom-right-radius: 40px;
            border: 4px solid orange;
            cursor: pointer;
        }

        .resetstyle{
            background-color: red;
            padding: 20px 40px;
            color: white;
            border: none;
            font-weight: bold;
            margin-left: 50px;
            border-top-right-radius: 40px;
            border-bottom-left-radius: 40px;
            border: 4px solid orange;
            cursor: pointer;
        }

        .thirdbutton{
            background-color: blue;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            color: white;
            border: 4px solid orange;
            font-weight: bold;
            cursor: pointer;
            margin-left: 50px;
        }

        .buttonstyle:hover, .resetstyle:hover, .thirdbutton:hover{
            background-color: orange;
        }
    </style>
    <body>
        <h1 id="mainheading">Buttons</h1>
        <button id="submitbtn">submit</button>
        <button id="resetbtn">reset</button>
        <button id="roundbtn">circle</button>
    </body>

    <script>
        let submitbtn = document.getElementById("submitbtn");
        submitbtn.classList.add("buttonstyle");

        let resetbtn = document.getElementById("resetbtn");
        resetbtn.classList.add("resetstyle");

        let roundbtn = document.getElementById("roundbtn");
        roundbtn.classList.add("thirdbutton");
    </script>
</html>
