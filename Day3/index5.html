<!DOCTYPE html>
<html lang="en">    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Program - 5</title>
        <link rel="stylesheet" href="index5.css">
    </head>
    <body>
        <h1>Display Properties</h1>
        <h2>display:block(default)</h2>
        <div class="box block">This is a block</div>
        <div class="box block">This is a block too</div>

        <h2>display:inline</h2>
        <div class="box inline">inline CSS</div>
        <div class="box inline">inline CSS</div>
        <div class="box inline">inline CSS</div>

        <h2>display:inline-block</h2>
        <div class="box inline-block">inline-block</div>
        <div class="box inline-block">inline-block</div>
        <div class="box inline-block">inline-block</div>

        <h2>display:none(hidden)</h2>
        <div class="box none">This will hide</div>
        
</html>
